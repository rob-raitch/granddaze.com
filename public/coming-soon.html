    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #f7faf8;
      color: #1a2e30;
    }

    * {
      box-sizing: border-box;
    }

    body {
      align-items: center;
      display: flex;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(20px, 5vw, 56px);
    }

    main {
      align-items: center;
      border: 1px solid rgba(70, 74, 34, 0.18);
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 760px;
      min-height: min(680px, calc(100svh - 40px));
      padding: clamp(40px, 10vw, 100px) 24px;
      position: relative;
      text-align: center;
      width: 100%;
    }

    main::before,
    main::after {
      background: #f7faf8;
      content: "";
      height: 1px;
      left: 50%;
      position: absolute;
      transform: translateX(-50%);
      width: 64px;
    }

    main::before {
      top: -1px;
    }

    main::after {
      bottom: -1px;
    }

    .logo {
      display: block;
      height: auto;
      margin-bottom: clamp(38px, 8vw, 68px);
      max-width: 100%;
      width: 380px;
    }

    .location {
      color: #677c48;
      font-family: "Grand Daze Accent", Georgia, serif;
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      margin: 0 0 12px;
    }

    h1 {
      color: #2a494c;
      font-family: "Grand Daze Display", Georgia, serif;
      font-size: clamp(2.8rem, 9vw, 5.5rem);
      font-weight: normal;
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin: 0;
    }

    .message {
      color: #597477;
      font-size: clamp(0.9rem, 2vw, 1rem);
      letter-spacing: 0.12em;
      line-height: 1.7;
      margin: 24px 0 0;
      text-transform: uppercase;
    }
  </style>
